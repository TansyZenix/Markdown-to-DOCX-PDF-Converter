page:
  width_cm: 21.0
  height_cm: 29.7
  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 3.0
  margin_right_cm: 2.5
fonts:
  east_asia: "宋体"
  latin: "Times New Roman"
  code: "Consolas"
  color: "000000"
body:
  font_size_pt: 10.5
  line_spacing_pt: 20
  space_before_pt: 0
  space_after_pt: 0
headings:
  "1": {font_size_pt: 16, bold: true, space_before_pt: 12, space_after_pt: 6}
  "2": {font_size_pt: 14, bold: true, space_before_pt: 10, space_after_pt: 4}
  "3": {font_size_pt: 12, bold: true, space_before_pt: 8, space_after_pt: 2}
captions:
  font_size_pt: 9
  bold: true
  figure: {space_before_pt: 6, space_after_pt: 12}
  table: {space_before_pt: 12, space_after_pt: 6}
images:
  max_width_ratio: 1.0
tables:
  font_size_pt: 10.5
  top_bottom_border_pt: 1.5
  header_border_pt: 0.5
  cell_padding_pt: 3
code:
  font_size_pt: 9
  line_spacing_pt: 12
blockquote:
  left_indent_cm: 0.74
